<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub File Explorer - Rust WASM Worker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            color: #c9d1d9;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #30363d;
        }
        
        header h1 {
            font-size: 1.3rem;
            color: #58a6ff;
        }
        
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .status-indicator { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
        .status-dot.ready { background: #3fb950; }
        .status-dot.loading { background: #d29922; animation: pulse 1s infinite; }
        .status-dot.error { background: #f85149; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .main-content {
            flex: 1;
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            overflow: hidden;
        }
        
        .sidebar {
            width: 300px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-header h2 { font-size: 0.9rem; font-weight: 600; }
        .repo-info { font-size: 0.75rem; color: #8b949e; }
        
        .file-tree { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
        
        .tree-item {
            padding: 0.4rem 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        
        .tree-item:hover { background: #21262d; }
        .tree-item.selected { background: #1f6feb33; }
        
        .breadcrumb {
            padding: 0.5rem 1rem;
            background: #0d1117;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.85rem;
        }
        
        .breadcrumb a { color: #58a6ff; text-decoration: none; cursor: pointer; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb span { color: #8b949e; }
        
        .editor-area {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .editor-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
        }
        
        .editor-title { font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .editor-actions { display: flex; gap: 0.5rem; }
        .editor-content { flex: 1; overflow: hidden; }
        
        #fileContent {
            width: 100%;
            height: 100%;
            background: #0d1117;
            color: #c9d1d9;
            border: none;
            padding: 1rem;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            outline: none;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8b949e;
            text-align: center;
            padding: 2rem;
        }
        
        .empty-state h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #c9d1d9; }
        
        button {
            padding: 0.5rem 1rem;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            background: #21262d;
            color: #c9d1d9;
        }
        
        button:hover:not(:disabled) { background: #30363d; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #238636; border-color: #238636; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #2ea043; }
        .btn-small { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
        
        .status-badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-weight: 500;
        }
        
        .status-badge.synced { background: #238636; color: #fff; }
        .status-badge.modified { background: #9e6a03; color: #fff; }
        
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-overlay.hidden { display: none; }
        
        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
        }
        
        .modal h2 { color: #58a6ff; margin-bottom: 1rem; font-size: 1.2rem; }
        .modal p { color: #8b949e; margin-bottom: 1rem; font-size: 0.9rem; }
        
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.25rem; }
        .form-group input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #0d1117;
            color: #c9d1d9;
            font-size: 0.9rem;
        }
        .form-group input:focus { outline: none; border-color: #58a6ff; }
        .form-row { display: flex; gap: 1rem; }
        .form-row .form-group { flex: 1; }
        .modal-buttons { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
        
        .search-bar { padding: 0.5rem 1rem; border-bottom: 1px solid #30363d; }
        .search-bar input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #0d1117;
            color: #c9d1d9;
            font-size: 0.85rem;
        }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 6px;
            background: #161b22;
            border: 1px solid #30363d;
            z-index: 1001;
        }
        
        .toast.hidden { display: none; }
        .toast.success { border-color: #238636; }
        .toast.error { border-color: #f85149; }
        
        .loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #8b949e; }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📂 GitHub File Explorer <span style="font-size: 0.7em; color: #8b949e;">via Rust/WASM</span></h1>
            <div class="header-right">
                <div class="status-indicator">
                    <div id="statusDot" class="status-dot loading"></div>
                    <span id="statusText">Initializing...</span>
                </div>
                <button id="configBtn" class="btn-small">⚙️ Config</button>
            </div>
        </header>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2>Files</h2>
                    <span id="repoInfo" class="repo-info">Not configured</span>
                </div>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search files...">
                </div>
                <div class="breadcrumb" id="breadcrumb"><a data-path="">root</a></div>
                <div class="file-tree" id="fileTree">
                    <div class="loading"><div class="spinner"></div>Loading...</div>
                </div>
            </div>
            
            <div class="editor-area">
                <div class="editor-header">
                    <div class="editor-title" id="editorTitle"><span>No file selected</span></div>
                    <div class="editor-actions">
                        <button id="refreshBtn" class="btn-small">🔄 Refresh</button>
                        <button id="saveBtn" class="btn-primary btn-small" disabled>💾 Save to GitHub</button>
                    </div>
                </div>
                <div class="editor-content">
                    <div id="emptyState" class="empty-state">
                        <h3>Select a file to view</h3>
                        <p>Choose a file from the sidebar or configure your repository.</p>
                    </div>
                    <textarea id="fileContent" style="display: none;"></textarea>
                </div>
            </div>
        </div>
    </div>
    
    <div id="configModal" class="modal-overlay hidden">
        <div class="modal">
            <h2>⚙️ GitHub Configuration</h2>
            <p>Configure your GitHub repository settings.</p>
            <div class="form-row">
                <div class="form-group"><label>Owner</label><input type="text" id="configOwner" placeholder="username"></div>
                <div class="form-group"><label>Repository</label><input type="text" id="configRepo" placeholder="repo-name"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Branch</label><input type="text" id="configBranch" placeholder="main"></div>
                <div class="form-group"><label>Base Path</label><input type="text" id="configPath" placeholder="(optional)"></div>
            </div>
            <div class="form-group"><label>Auth Token</label><input type="password" id="configAuth" placeholder="ghp_xxxx..."></div>
            <div class="form-group"><label>Email</label><input type="email" id="configEmail" placeholder="your@email.com"></div>
            <div class="modal-buttons">
                <button id="cancelConfigBtn">Cancel</button>
                <button id="saveConfigBtn" class="btn-primary">Save & Connect</button>
            </div>
        </div>
    </div>
    
    <div id="saveModal" class="modal-overlay hidden">
        <div class="modal">
            <h2>💾 Save to GitHub</h2>
            <div class="form-group"><label>Commit Message</label><input type="text" id="commitMessage" placeholder="Update file"></div>
            <div class="modal-buttons">
                <button id="cancelSaveBtn">Cancel</button>
                <button id="confirmSaveBtn" class="btn-primary">Save & Commit</button>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast hidden"></div>

    <script type="module">
        import { GitHubFS } from './GitHubFS.js';
        
        const fs = new GitHubFS();
        let currentPath = '';
        let currentFile = null;
        let hasUnsavedChanges = false;
        
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const repoInfo = document.getElementById('repoInfo');
        const fileTree = document.getElementById('fileTree');
        const breadcrumb = document.getElementById('breadcrumb');
        const editorTitle = document.getElementById('editorTitle');
        const fileContent = document.getElementById('fileContent');
        const emptyState = document.getElementById('emptyState');
        const saveBtn = document.getElementById('saveBtn');
        const configModal = document.getElementById('configModal');
        const saveModal = document.getElementById('saveModal');
        
        async function init() {
            try {
                await fs.ready();
                const config = fs.getConfig();
                updateStatus('ready', 'Ready');
                updateRepoInfo(config);
                if (config && config.owner && config.repo) {
                    await loadDirectory('');
                } else {
                    showConfigModal();
                }
            } catch (error) {
                updateStatus('error', 'Error: ' + error.message);
                showToast('Failed to initialize', 'error');
            }
        }
        
        function updateStatus(state, text) {
            statusDot.className = 'status-dot ' + state;
            statusText.textContent = text;
        }
        
        function updateRepoInfo(config) {
            if (config && config.owner && config.repo) {
                repoInfo.textContent = `${config.owner}/${config.repo}`;
            } else {
                repoInfo.textContent = 'Not configured';
            }
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
        
        async function loadDirectory(path) {
            fileTree.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
            updateBreadcrumb(path);
            
            try {
                const items = await fs.getDirectory(path);
                renderFileTree(items, path);
                currentPath = path;
            } catch (error) {
                fileTree.innerHTML = `<div class="empty-state"><p>Error: ${error.message}</p></div>`;
                if (error.code === 'HTTP_401' || error.code === 'HTTP_403') {
                    showConfigModal();
                }
            }
        }
        
        function renderFileTree(items, basePath) {
            if (!items || items.length === 0) {
                fileTree.innerHTML = '<div class="empty-state"><p>Empty directory</p></div>';
                return;
            }
            
            items.sort((a, b) => {
                if (a.type === 'dir' && b.type !== 'dir') return -1;
                if (a.type !== 'dir' && b.type === 'dir') return 1;
                return a.name.localeCompare(b.name);
            });
            
            fileTree.innerHTML = '';
            
            if (basePath) {
                const parentPath = basePath.split('/').slice(0, -1).join('/');
                const parentItem = document.createElement('div');
                parentItem.className = 'tree-item';
                parentItem.innerHTML = '<span>📁</span><span>..</span>';
                parentItem.onclick = () => loadDirectory(parentPath);
                fileTree.appendChild(parentItem);
            }
            
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'tree-item';
                const icon = item.type === 'dir' ? '📁' : '📄';
                div.innerHTML = `<span>${icon}</span><span>${item.name}</span>`;
                div.onclick = () => item.type === 'dir' ? loadDirectory(item.path) : selectFile(item.path);
                fileTree.appendChild(div);
            });
        }
        
        function updateBreadcrumb(path) {
            const parts = path ? path.split('/') : [];
            let html = '<a data-path="">root</a>';
            let acc = '';
            parts.forEach((part, i) => {
                acc += (i > 0 ? '/' : '') + part;
                html += ` <span>/</span> <a data-path="${acc}">${part}</a>`;
            });
            breadcrumb.innerHTML = html;
            breadcrumb.querySelectorAll('a').forEach(a => a.onclick = () => loadDirectory(a.dataset.path));
        }
        
        async function selectFile(path) {
            if (hasUnsavedChanges && !confirm('Discard unsaved changes?')) return;
            
            updateStatus('loading', 'Loading...');
            emptyState.style.display = 'none';
            fileContent.style.display = 'block';
            fileContent.value = 'Loading...';
            fileContent.disabled = true;
            
            try {
                const file = await fs.getFile(path);
                currentFile = file;
                hasUnsavedChanges = false;
                fileContent.value = file.content;
                fileContent.disabled = false;
                updateEditorTitle(file);
                updateStatus('ready', 'Ready');
            } catch (error) {
                fileContent.value = 'Error: ' + error.message;
                updateStatus('error', 'Error');
            }
        }
        
        function updateEditorTitle(file) {
            const badge = file.status === 'modified' 
                ? '<span class="status-badge modified">Modified</span>'
                : '<span class="status-badge synced">Synced</span>';
            editorTitle.innerHTML = `<span>${file.name}</span>${badge}`;
            saveBtn.disabled = file.status === 'synced';
        }
        
        fileContent.oninput = () => {
            if (currentFile && fileContent.value !== currentFile.content) {
                hasUnsavedChanges = true;
                currentFile.status = 'modified';
                updateEditorTitle(currentFile);
            }
        };
        
        function showSaveModal() {
            if (!currentFile) return;
            document.getElementById('commitMessage').value = `Update ${currentFile.name}`;
            saveModal.classList.remove('hidden');
        }
        
        async function saveToGitHub() {
            const message = document.getElementById('commitMessage').value.trim();
            if (!message) { showToast('Enter a commit message', 'error'); return; }
            
            saveModal.classList.add('hidden');
            updateStatus('loading', 'Saving...');
            
            try {
                const result = await fs.saveFile(currentFile.path, fileContent.value, message);
                currentFile = result.file;
                hasUnsavedChanges = false;
                updateEditorTitle(currentFile);
                updateStatus('ready', 'Ready');
                showToast('File saved!', 'success');
            } catch (error) {
                updateStatus('error', 'Save failed');
                showToast('Failed: ' + error.message, 'error');
            }
        }
        
        function showConfigModal() {
            const config = fs.getConfig() || {};
            document.getElementById('configOwner').value = config.owner || '';
            document.getElementById('configRepo').value = config.repo || '';
            document.getElementById('configBranch').value = config.branch || 'main';
            document.getElementById('configPath').value = config.path || '';
            document.getElementById('configAuth').value = config.auth || '';
            document.getElementById('configEmail').value = config.email || '';
            configModal.classList.remove('hidden');
        }
        
        async function saveConfig() {
            const config = {
                owner: document.getElementById('configOwner').value.trim(),
                repo: document.getElementById('configRepo').value.trim(),
                branch: document.getElementById('configBranch').value.trim() || 'main',
                path: document.getElementById('configPath').value.trim(),
                auth: document.getElementById('configAuth').value.trim(),
                email: document.getElementById('configEmail').value.trim() || 'user@example.com',
            };
            
            if (!config.owner || !config.repo) {
                showToast('Owner and Repository required', 'error');
                return;
            }
            
            configModal.classList.add('hidden');
            updateStatus('loading', 'Connecting...');
            
            try {
                await fs.setConfig(config);
                updateRepoInfo(config);
                await loadDirectory('');
                showToast('Connected!', 'success');
            } catch (error) {
                updateStatus('error', 'Failed');
                showToast('Failed: ' + error.message, 'error');
            }
        }
        
        saveBtn.onclick = showSaveModal;
        document.getElementById('confirmSaveBtn').onclick = saveToGitHub;
        document.getElementById('cancelSaveBtn').onclick = () => saveModal.classList.add('hidden');
        document.getElementById('configBtn').onclick = showConfigModal;
        document.getElementById('saveConfigBtn').onclick = saveConfig;
        document.getElementById('cancelConfigBtn').onclick = () => configModal.classList.add('hidden');
        document.getElementById('refreshBtn').onclick = async () => {
            await fs.clearCache();
            await loadDirectory(currentPath);
            showToast('Refreshed', 'success');
        };
        
        configModal.onclick = (e) => { if (e.target === configModal) configModal.classList.add('hidden'); };
        saveModal.onclick = (e) => { if (e.target === saveModal) saveModal.classList.add('hidden'); };
        
        document.onkeydown = (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                e.preventDefault();
                if (currentFile && hasUnsavedChanges) showSaveModal();
            }
        };
        
        init();
    </script>
</body>
</html>
