name: Deploy Demo & Notify
on:
  push:
    branches:
      - weaux

permissions:
  contents: write

jobs:
  deploy-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./aardvark  # The inner aardvark directory containing components/ and www/
          destination_dir: ./      # Deploy to root of gh-pages branch
          
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Demo Deployed!
            
            Branch: ${{ github.ref_name }}
            
            🔗 Session Store Demo:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/components/storage/session-store/demo/index.html
            
            🔗 File Store Demo:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/components/storage/file-store/demo/index.html
