<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat - Rust WASM Worker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            text-align: center;
            padding: 1rem 0;
            border-bottom: 1px solid #333;
        }
        
        header h1 {
            font-size: 1.5rem;
            color: #4fc3f7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            font-size: 0.85rem;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }
        
        .status-dot.ready { background: #4caf50; }
        .status-dot.loading { background: #ff9800; animation: pulse 1s infinite; }
        .status-dot.error { background: #f44336; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
            color: #000;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant {
            align-self: flex-start;
            background: #2d2d44;
            border-bottom-left-radius: 4px;
        }
        
        .message.system {
            align-self: center;
            background: #333;
            font-size: 0.85rem;
            color: #888;
        }
        
        .message.error {
            align-self: center;
            background: #5c2a2a;
            color: #ff8a80;
            border: 1px solid #f44336;
        }
        
        .message.thinking {
            align-self: flex-start;
            background: #2d2d44;
            color: #888;
        }
        
        .thinking-dots {
            display: inline-flex;
            gap: 4px;
        }
        
        .thinking-dots span {
            width: 6px;
            height: 6px;
            background: #4fc3f7;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .input-area {
            padding: 1rem 0;
            border-top: 1px solid #333;
        }
        
        .input-row {
            display: flex;
            gap: 0.5rem;
        }
        
        #messageInput {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #333;
            border-radius: 24px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        #messageInput:focus {
            border-color: #4fc3f7;
        }
        
        #messageInput:disabled {
            opacity: 0.5;
        }
        
        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
            color: #000;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: scale(1.05);
        }
        
        .btn-secondary {
            background: #333;
            color: #e0e0e0;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #444;
        }
        
        /* API Key Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-overlay.hidden {
            display: none;
        }
        
        .modal {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }
        
        .modal h2 {
            color: #4fc3f7;
            margin-bottom: 1rem;
        }
        
        .modal p {
            color: #888;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        
        .modal input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #333;
            border-radius: 8px;
            background: #16213e;
            color: #e0e0e0;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        
        .modal input:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        
        .modal-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }
        
        .toolbar {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .toolbar button {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-radius: 8px;
        }
        
        .info-text {
            font-size: 0.75rem;
            color: #666;
            text-align: center;
            margin-top: 0.5rem;
        }
        
        /* Message content styling */
        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .message-content code {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9em;
        }
        
        .message-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.75rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        
        .message-content pre code {
            background: none;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🦀 Gemini Chat <span style="font-size: 0.7em; color: #888;">via Rust/WASM</span></h1>
        </header>
        
        <div class="status-bar">
            <div class="status-indicator">
                <div id="statusDot" class="status-dot loading"></div>
                <span id="statusText">Initializing...</span>
            </div>
            <button id="apiKeyBtn" class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
                🔑 API Key
            </button>
        </div>
        
        <div id="chatContainer" class="chat-container">
            <div class="message system">
                Loading Rust/WASM module...
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="messageInput" placeholder="Type your message..." disabled>
                <button id="sendBtn" class="btn-primary" disabled>Send</button>
            </div>
            <div class="toolbar">
                <button id="clearBtn" class="btn-secondary">🗑️ Clear Chat</button>
            </div>
            <div class="info-text">
                Messages are processed by Rust/WASM running in a Web Worker
            </div>
        </div>
    </div>
    
    <!-- API Key Modal -->
    <div id="apiKeyModal" class="modal-overlay hidden">
        <div class="modal">
            <h2>🔑 Gemini API Key</h2>
            <p>
                Enter your Gemini API key to start chatting. You can get one from 
                <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color: #4fc3f7;">Google AI Studio</a>.
            </p>
            <input type="password" id="apiKeyInput" placeholder="Enter your API key...">
            <label style="display: flex; align-items: center; gap: 0.5rem; color: #888; font-size: 0.85rem; margin-bottom: 1rem;">
                <input type="checkbox" id="saveKeyCheckbox" checked>
                Save in localStorage
            </label>
            <div class="modal-buttons">
                <button id="cancelKeyBtn" class="btn-secondary">Cancel</button>
                <button id="saveKeyBtn" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script type="module">
        // DOM Elements
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const apiKeyBtn = document.getElementById('apiKeyBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        
        // Modal elements
        const apiKeyModal = document.getElementById('apiKeyModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyCheckbox = document.getElementById('saveKeyCheckbox');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const cancelKeyBtn = document.getElementById('cancelKeyBtn');
        
        // State
        let worker = null;
        let isReady = false;
        let hasApiKey = false;
        let isThinking = false;
        
        // Initialize worker
        function initWorker() {
            worker = new Worker('./worker.js', { type: 'module' });
            
            worker.onmessage = handleWorkerMessage;
            worker.onerror = (error) => {
                console.error('Worker error:', error);
                setStatus('error', 'Worker error');
                addMessage('Worker error: ' + error.message, 'error');
            };
        }
        
        // Handle messages from worker
        function handleWorkerMessage(event) {
            const { type, message, error, errorCode, hasKey, ready } = event.data;
            
            console.log('[Main] Worker message:', type, event.data);
            
            switch (type) {
                case 'ready':
                    isReady = true;
                    clearChat();
                    addMessage('Rust/WASM module loaded! Ready to chat.', 'system');
                    
                    // Try to load API key
                    loadApiKey();
                    break;
                    
                case 'api_key_status':
                    hasApiKey = hasKey;
                    updateStatus();
                    if (hasKey) {
                        addMessage('API key configured. You can start chatting!', 'system');
                    }
                    break;
                    
                case 'thinking':
                    isThinking = true;
                    showThinking();
                    break;
                    
                case 'response':
                    isThinking = false;
                    removeThinking();
                    addMessage(message, 'assistant');
                    enableInput();
                    break;
                    
                case 'error':
                    isThinking = false;
                    removeThinking();
                    
                    if (errorCode === 'MISSING_API_KEY') {
                        addMessage('API key is missing. Please set your Gemini API key.', 'error');
                        showApiKeyModal();
                    } else {
                        addMessage('Error: ' + error, 'error');
                    }
                    enableInput();
                    break;
                    
                case 'history_cleared':
                    addMessage('Conversation history cleared.', 'system');
                    break;
            }
        }
        
        // Load API key from localStorage
        function loadApiKey() {
            let apiKey = localStorage.getItem('GEMINI_API_KEY');
            
            if (apiKey) {
                worker.postMessage({ type: 'set_api_key', payload: { apiKey } });
            } else {
                setStatus('error', 'No API key');
                addMessage('No API key found. Please set your Gemini API key to start chatting.', 'error');
                showApiKeyModal();
            }
        }
        
        // Update status display
        function updateStatus() {
            if (!isReady) {
                setStatus('loading', 'Initializing...');
            } else if (!hasApiKey) {
                setStatus('error', 'No API key');
            } else if (isThinking) {
                setStatus('loading', 'Thinking...');
            } else {
                setStatus('ready', 'Ready');
            }
            
            // Enable/disable input
            const canChat = isReady && hasApiKey && !isThinking;
            messageInput.disabled = !canChat;
            sendBtn.disabled = !canChat;
        }
        
        function setStatus(state, text) {
            statusDot.className = 'status-dot ' + state;
            statusText.textContent = text;
        }
        
        // Chat functions
        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = 'message ' + type;
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            
            div.appendChild(content);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function showThinking() {
            const div = document.createElement('div');
            div.className = 'message thinking';
            div.id = 'thinking';
            div.innerHTML = `
                <div class="thinking-dots">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            updateStatus();
        }
        
        function removeThinking() {
            const thinking = document.getElementById('thinking');
            if (thinking) thinking.remove();
            updateStatus();
        }
        
        function clearChat() {
            chatContainer.innerHTML = '';
        }
        
        function enableInput() {
            isThinking = false;
            updateStatus();
            messageInput.focus();
        }
        
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !isReady || !hasApiKey || isThinking) return;
            
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            
            worker.postMessage({ type: 'chat', payload: { message } });
        }
        
        // Modal functions
        function showApiKeyModal() {
            apiKeyModal.classList.remove('hidden');
            apiKeyInput.value = localStorage.getItem('GEMINI_API_KEY') || '';
            apiKeyInput.focus();
        }
        
        function hideApiKeyModal() {
            apiKeyModal.classList.add('hidden');
        }
        
        function saveApiKey() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert('Please enter an API key');
                return;
            }
            
            if (saveKeyCheckbox.checked) {
                localStorage.setItem('GEMINI_API_KEY', apiKey);
            } else {
                localStorage.removeItem('GEMINI_API_KEY');
            }
            
            worker.postMessage({ type: 'set_api_key', payload: { apiKey } });
            hasApiKey = true;
            updateStatus();
            hideApiKeyModal();
        }
        
        // Event listeners
        sendBtn.onclick = sendMessage;
        messageInput.onkeypress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };
        
        clearBtn.onclick = () => {
            clearChat();
            worker.postMessage({ type: 'clear_history' });
        };
        
        apiKeyBtn.onclick = showApiKeyModal;
        cancelKeyBtn.onclick = hideApiKeyModal;
        saveKeyBtn.onclick = saveApiKey;
        
        apiKeyInput.onkeypress = (e) => {
            if (e.key === 'Enter') saveApiKey();
        };
        
        // Close modal on outside click
        apiKeyModal.onclick = (e) => {
            if (e.target === apiKeyModal) hideApiKeyModal();
        };
        
        // Initialize
        initWorker();
    </script>
</body>
</html>
