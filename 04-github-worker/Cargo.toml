[package]
name = "github-worker"
version = "0.1.0"
edition = "2021"
description = "Rust WASM module for GitHub file operations via Octokit"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = { version = "0.1", optional = true }
base64 = "0.22"
url = "2.5"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
]

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
