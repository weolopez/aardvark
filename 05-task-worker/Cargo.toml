[package]
name = "task-worker"
version = "0.1.0"
edition = "2021"
description = "Task management system for LLM agents running in browser WASM"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "WorkerGlobalScope",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "IdbCursorWithValue",
    "IdbKeyRange",
    "DomStringList",
    "Event",
    "Performance",
]

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
