<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Agent — Browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Setup Screen -->
    <div id="setup" class="setup-screen">
        <h1>🤖 Browser Coding Agent</h1>
        <p class="hint">Rust/WASM agent with virtual filesystem &amp; Gemini LLM</p>

        <div class="form-group">
            <label for="apiKey">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="AIza...">
            <span class="hint">Get one at <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--accent)">Google AI Studio</a></span>
        </div>

        <div class="form-group">
            <label for="repoInput">GitHub Repository (optional)</label>
            <input type="text" id="repoInput" placeholder="owner/repo (e.g. weolopez/aardvark)">
            <span class="hint">Load a repo into the virtual filesystem</span>
        </div>

        <button id="connectBtn">Connect Agent</button>
        <div id="setupError" class="hint" style="color:#f44336"></div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <header>
            <h1>🤖 Coding Agent</h1>
            <div class="header-controls">
                <span id="repoLabel" style="font-size:0.8rem;color:var(--text-muted)"></span>
                <button id="clearBtn" title="New session">⟳ New</button>
            </div>
        </header>

        <main>
            <!-- Chat Panel -->
            <div class="chat-panel">
                <div id="chatMessages" class="chat-messages"></div>
                <div class="input-area">
                    <textarea id="messageInput" placeholder="Ask me to do something... (Cmd+Enter to send)" rows="2"></textarea>
                    <button id="sendBtn">Send</button>
                </div>
            </div>

            <!-- Sidebar: File Explorer -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <span>📁 Files</span>
                    <button id="refreshFs" title="Refresh">↻</button>
                </div>
                <div id="fileTree" class="file-tree"></div>
                <div class="status-bar">
                    <span id="pwdDisplay">/</span>
                    <span id="fileCount">0 files</span>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
